<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Store · Feature flag demo</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="show-tags">
  <!-- Demo controls: not part of the shop. They pick the shopper and show what the flags said. -->
  <div class="demo-bar" role="region" aria-label="Demo controls">
    <div class="wrap demo-row">
      <span class="demo-label">Demo</span>
      <label class="demo-field">
        <span>Shopper</span>
        <select id="shopper-select"></select>
      </label>
      <form id="custom-form" class="demo-field">
        <label for="custom-id" class="sr-only">Any shopper id</label>
        <input id="custom-id" maxlength="100" placeholder="or any id, e.g. u-5555" autocomplete="off">
        <button type="submit">Use</button>
      </form>
      <button type="button" id="refresh">Refresh flags</button>
      <label class="demo-check"><input type="checkbox" id="show-tags" checked> Show flag names</label>
      <button type="button" id="inspector-toggle" aria-expanded="false" aria-controls="inspector">Flag inspector</button>
      <span id="status" class="status" aria-live="polite">Loading flags…</span>
    </div>
  </div>

  <div id="banners"></div>

  <header class="top">
    <div class="wrap top-row">
      <a class="logo" href="/">Acme<span>Store</span></a>
      <form id="search-form" class="search" role="search">
        <label for="search" class="sr-only">Search products</label>
        <input id="search" type="search" placeholder="Search products" autocomplete="off">
      </form>
      <div id="header-tools" class="header-tools"></div>
    </div>
    <div id="filters" class="wrap"></div>
  </header>

  <main class="wrap layout">
    <div class="shop">
      <section id="persona" class="persona" aria-live="polite"></section>
      <section aria-labelledby="products-heading">
        <div class="section-head">
          <h2 id="products-heading">Products</h2>
          <div id="wishlist-tools"></div>
        </div>
        <div id="products" class="grid"></div>
      </section>
      <section id="recs" aria-live="polite"></section>
      <section id="account" class="card" aria-labelledby="account-heading"></section>
    </div>

    <aside class="side">
      <section id="basket" class="card" aria-labelledby="basket-heading"></section>
      <section id="checkout" class="card" aria-live="polite" hidden></section>
    </aside>
  </main>

  <aside id="inspector" class="inspector" aria-labelledby="inspector-heading" hidden></aside>
  <div id="floating"></div>

  <footer class="wrap footer">
    Acme Store is a demo client for the Feature Flag Manager. Its API key stays on the store's
    server: this page only sees which features are on. If the flag service fails, every feature
    is off and the shop works as it did before.
  </footer>
</body>
</html>

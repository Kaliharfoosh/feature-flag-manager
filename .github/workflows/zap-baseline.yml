# OWASP ZAP baseline scan of the live site (S3 bonus, threat model T7/T12).
# Started by hand only (Actions → "ZAP baseline scan" → Run workflow), never on push: it sends real
# requests to the target. Baseline = a short crawl plus PASSIVE checks (headers, cookies, info
# leaks); it does not attack anything. Rules we accept on purpose are in .zap/rules.tsv with the
# reason. The HTML/Markdown/JSON report is uploaded as the artifact "zap-baseline-report".
name: ZAP baseline scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: URL to scan
        required: true
        default: https://feature-flag-manager-cyan.vercel.app

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -m 2'          # -a: include alpha passive rules; -m 2: spider at most 2 minutes
          allow_issue_writing: false      # no GitHub issue per scan; the report is the artifact
          fail_action: false              # warnings are reviewed, not a red build
          artifact_name: zap-baseline-report
